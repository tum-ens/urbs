name: Build and Push Docker Image

on:
  push:
    tags:
      - 'weburbs_v*.*.*'

jobs:
  buildOptimizer:
    runs-on: ubuntu-latest

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}-weburbs
          # generate Docker tags based on the following events/attributes
          tags: |
            type=match,pattern=weburbs_v(\d+),group=1
            type=match,pattern=weburbs_v(\d+.\d+),group=1
            type=match,pattern=weburbs_v(\d+.\d+.\d+),group=1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          context: .
          cache-from: |
            user/app:cache
            type=local,src=.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  buildOptimizerGurobi:
    runs-on: ubuntu-latest

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}-weburbs-gurobi
          # generate Docker tags based on the following events/attributes
          tags: |
            type=match,pattern=weburbs_v(\d+),group=1
            type=match,pattern=weburbs_v(\d+.\d+),group=1
            type=match,pattern=weburbs_v(\d+.\d+.\d+),group=1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile-gurobi
          context: .
          cache-from: |
            user/app:cache
            type=local,src=.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}